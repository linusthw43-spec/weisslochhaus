<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>Weißlochhaus</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0d1420">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Weißlochhaus">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-180.png">
  <link rel="apple-touch-icon" href="icon-180.png">
  <style>
    /* Stil wie im Spiel: schwarze Pinsel-Kästen mit ausgefransten Rändern, dicke schräge weiße Schrift
       (Barlow, freie OFL-Schrift), eine Akzentfarbe. Bilder: tools/oberflaeche_bauen.py */
    @font-face { font-family: "Dick"; src: url("BarlowCondensed-ExtraBoldItalic.ttf") format("truetype"); font-display: swap; }
    @font-face { font-family: "Text"; src: url("BarlowSemiCondensed-SemiBoldItalic.ttf") format("truetype"); font-display: swap; }
    :root { --akzent: #ff941a; --schwarz: #08080a; }
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      background: #17130e; color: #fff; overflow: hidden;
      font-family: "Text", "Arial Narrow", -apple-system, "Segoe UI", sans-serif; font-style: italic;
      -webkit-user-select: none; user-select: none;
      -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
      overscroll-behavior: none;
    }
    canvas#spiel {
      position: fixed; left: 0; top: 0; width: 100vw; height: 100vh; height: 100dvh;
      display: block; background: #0b0b0c; touch-action: none; outline: none;
    }
    .schicht {
      position: fixed; inset: 0; display: none;
      flex-direction: column; align-items: center; justify-content: center;
      background: radial-gradient(ellipse at 50% 40%, #3a2e20 0%, #1c1711 55%, #0d0b08 100%); text-align: center;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }
    .schicht.an { display: flex; }

    /* Schwarzer Pinsel-Kasten (9 Felder: die Ränder bleiben, die Mitte dehnt sich) */
    .kasten {
      position: relative; box-sizing: border-box; min-width: min(86vw, 380px);
      border-style: solid; border-width: 30px 64px; border-image: url("kasten.png") 34 72 fill / 30px 64px stretch;
      display: flex; flex-direction: column; align-items: center;
      animation: rein 0.55s cubic-bezier(0.2, 1.5, 0.4, 1) both;
    }
    .kasten::before, .kasten::after {
      content: ""; position: absolute; z-index: -1; width: 170px; height: 170px;
      background: url("spritzer.png") center / contain no-repeat; pointer-events: none;
    }
    .kasten::before { left: -120px; top: -90px; }
    .kasten::after { right: -125px; bottom: -95px; transform: rotate(150deg); }
    @keyframes rein { from { transform: translateX(-115vw) skewX(-8deg); } to { transform: none; } }
    @keyframes rein-rechts { from { transform: translateX(115vw) skewX(8deg); } to { transform: none; } }

    h1 {
      font-family: "Dick", "Arial Narrow", sans-serif; font-size: 44px; line-height: 1; font-weight: 800;
      margin: 0 0 4px; letter-spacing: 0.5px; text-transform: uppercase;
    }
    h1::after { content: ""; display: block; height: 7px; margin: 6px 12% 0; background: var(--akzent); transform: skewX(-24deg); border-radius: 2px; }
    .klein { font-size: 16px; opacity: 0.85; margin: 8px 0 0; }

    /* Ladebalken */
    #lade { z-index: 20; }
    #balken { width: min(64vw, 400px); height: 14px; background: #2b2b2e; margin: 20px 0 8px; overflow: hidden; transform: skewX(-24deg); }
    #balken-voll { width: 0%; height: 100%; background: var(--akzent); transition: width 0.2s linear; }
    #prozent { font-family: "Dick", sans-serif; font-size: 26px; font-variant-numeric: tabular-nums; margin: 0; color: var(--akzent); }

    /* PIN-Tastenfeld */
    #pin { z-index: 30; }
    #punkte { display: flex; gap: 14px; margin: 14px 0 12px; }
    #punkte i { width: 16px; height: 16px; border: 3px solid #fff; box-sizing: border-box; transform: skewX(-14deg); }
    #punkte i.voll { background: var(--akzent); border-color: var(--akzent); }
    #punkte.falsch { animation: wackeln 0.35s; }
    #punkte.falsch i { border-color: #e2392d; background: #e2392d; }
    @keyframes wackeln {
      25% { transform: translateX(-10px); }
      50% { transform: translateX(10px); }
      75% { transform: translateX(-6px); }
    }
    #tasten { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px 4px; }
    #tasten button {
      width: 86px; height: 54px; padding: 0; box-sizing: border-box; background: none; color: #fff;
      border-style: solid; border-width: 10px 24px; border-image: url("knopf-hell.png") 16 46 fill / 10px 24px stretch;
      font-family: "Dick", sans-serif; font-style: italic; font-size: 28px; line-height: 1;
      touch-action: manipulation; cursor: pointer; transition: transform 0.08s, color 0.08s;
    }
    #tasten button:hover { transform: scale(1.08); color: var(--akzent); }
    #tasten button:active, #tasten button.gedrueckt { transform: scale(0.92); color: var(--akzent); }
    #tasten button.leer { visibility: hidden; }
    @media (orientation: landscape) and (max-height: 430px) {
      h1 { font-size: 30px; }
      #punkte { margin: 8px 0; }
      #tasten { grid-template-columns: repeat(6, 1fr); }
      #tasten button { width: 70px; height: 46px; font-size: 24px; }
      #tasten button.leer { display: none; }
      .kasten { border-width: 20px 56px; }
    }

    /* Startbild und Intro-Video */
    #start { z-index: 28; cursor: pointer; }
    #start .gross {
      font-family: "Dick", sans-serif; font-size: 26px; text-transform: uppercase; margin-top: 20px; padding: 10px 34px;
      background: var(--akzent); color: #0b0b0c; transform: skewX(-10deg); animation: pochen 1.1s ease-in-out infinite;
    }
    #start:hover .gross { background: #fff; }
    @keyframes pochen { 50% { transform: skewX(-10deg) scale(1.06); } }
    #film { z-index: 27; background: #000; padding: 0; }
    #film video { width: 100%; height: 100%; object-fit: contain; background: #000; }
    #film p { position: absolute; right: 16px; bottom: 14px; margin: 0; font-size: 15px; opacity: 0.75; }

    /* Hinweis: Handy quer halten */
    #dreh { z-index: 15; background: rgba(10, 9, 7, 0.94); }
    #dreh .kasten { animation-name: rein-rechts; }
    #dreh .symbol { font-size: 54px; line-height: 1; margin-bottom: 8px; font-style: normal; color: var(--akzent); }
    #dreh h1 { font-size: 30px; }

    #fehler {
      position: fixed; left: 8px; right: 8px; bottom: 8px; z-index: 40; display: none;
      background: #5b1d1a; color: #fff; font-size: 13px; padding: 10px 12px; border-radius: 8px; font-style: normal;
      white-space: pre-wrap; text-align: left; max-height: 40vh; overflow: auto;
      -webkit-user-select: text; user-select: text;
    }
    #stand { position: fixed; right: 10px; bottom: 8px; z-index: 25; font-size: 12px; opacity: 0.5; pointer-events: none; }
  </style>
</head>
<body>
  <canvas id="spiel" tabindex="-1"></canvas>

  <div id="lade" class="schicht"><div class="kasten">
    <h1>Weisslochhaus</h1>
    <div id="balken"><div id="balken-voll"></div></div>
    <p id="prozent">0 %</p>
    <p class="klein" id="lade-text">Lädt … beim ersten Mal dauert das etwas.</p>
  </div></div>

  <div id="pin" class="schicht"><div class="kasten">
    <h1>Weisslochhaus</h1>
    <p class="klein">PIN eingeben</p>
    <div id="punkte"><i></i><i></i><i></i><i></i></div>
    <div id="tasten">
      <button data-z="1">1</button><button data-z="2">2</button><button data-z="3">3</button>
      <button data-z="4">4</button><button data-z="5">5</button><button data-z="6">6</button>
      <button data-z="7">7</button><button data-z="8">8</button><button data-z="9">9</button>
      <button class="leer"></button><button data-z="0">0</button><button data-z="x">⌫</button>
    </div>
  </div></div>

  <div id="start" class="schicht"><div class="kasten">
    <h1>Weisslochhaus</h1>
    <p class="klein">Die Klassenfahrt in den Schwarzwald</p>
    <div class="gross">Tippen zum Starten</div>
  </div></div>

  <div id="film" class="schicht">
    <video id="intro" playsinline webkit-playsinline preload="auto"></video>
    <p>Tippen zum Überspringen</p>
  </div>

  <div id="dreh" class="schicht"><div class="kasten">
    <div class="symbol">⟳</div>
    <h1>Bitte Handy quer halten</h1>
    <p class="klein">Das Spiel ist fürs Querformat gemacht.</p>
  </div></div>

  <div id="fehler"></div>
  <div id="stand"></div>

  <script>
    var BUILD = "0.6.2 · 13.11.2026 15:05";
    var PIN_HASH = "0f9305fb9daaca6e97608d3bdcf8961b59b080bdffe35613e1deade56823785f";
    var MERKER = "wlh_frei";
    var mobil = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent) ||
                (navigator.maxTouchPoints > 1 && /Macintosh/.test(navigator.userAgent));
    var canvas = document.getElementById("spiel");
    document.getElementById("stand").textContent = BUILD;

    function zeig(id, an) { document.getElementById(id).classList.toggle("an", an); }

    // ---------- Fehler sichtbar machen (auf dem iPhone gibt es keine Konsole) ----------
    function zeigeFehler(text) {
      if (/pointer ?lock/i.test(String(text))) return;   // Maus-Sperre abgelehnt: harmlos
      var kasten = document.getElementById("fehler");
      kasten.style.display = "block";
      kasten.textContent += (kasten.textContent ? "\n" : "") + text;
    }
    window.addEventListener("error", function (e) {
      zeigeFehler("Fehler: " + (e.message || e.type) + (e.filename ? " (" + e.filename.split("/").pop() + ":" + e.lineno + ")" : ""));
    });
    window.addEventListener("unhandledrejection", function (e) {
      zeigeFehler("Fehler: " + (e.reason && e.reason.message ? e.reason.message : e.reason));
    });

    // ---------- Auto-Update: gibt es online einen neueren Stand, einmal frisch laden ----------
    function pruefeUpdate() {
      return fetch("version.json?t=" + Date.now(), { cache: "no-store" })
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (v) {
          if (!v || !v.build || v.build === BUILD) return false;
          var schon = null;
          try { schon = sessionStorage.getItem("wlh_update"); } catch (e) {}
          if (schon === v.build) return false;
          try { sessionStorage.setItem("wlh_update", v.build); } catch (e) {}
          location.replace(location.pathname + "?v=" + encodeURIComponent(v.build));
          return true;
        })
        .catch(function () { return false; });
    }

    // ---------- PIN ----------
    function hashVon(text) {
      var daten = new TextEncoder().encode(text);
      return crypto.subtle.digest("SHA-256", daten).then(function (puffer) {
        return Array.from(new Uint8Array(puffer)).map(function (b) {
          return b.toString(16).padStart(2, "0");
        }).join("");
      });
    }
    function istFrei() {
      try { return localStorage.getItem(MERKER) === PIN_HASH; } catch (e) { return false; }
    }
    function pinAbfrage() {
      return new Promise(function (fertig) {
        var eingabe = "";
        var punkte = document.getElementById("punkte");
        function male() {
          var liste = punkte.children;
          for (var i = 0; i < liste.length; i++) liste[i].classList.toggle("voll", i < eingabe.length);
        }
        function pruefe() {
          hashVon(eingabe).then(function (h) {
            if (h === PIN_HASH) {
              try { localStorage.setItem(MERKER, PIN_HASH); } catch (e) {}
              zeig("pin", false);
              fertig();
              return;
            }
            punkte.classList.add("falsch");
            setTimeout(function () {
              punkte.classList.remove("falsch");
              eingabe = "";
              male();
            }, 400);
          });
        }
        function taste(z) {
          if (punkte.classList.contains("falsch")) return;
          if (z === "x") eingabe = eingabe.slice(0, -1);
          else if (eingabe.length < 4) eingabe += z;
          male();
          if (eingabe.length === 4) pruefe();
        }
        document.getElementById("tasten").addEventListener("pointerdown", function (e) {
          var knopf = e.target.closest("button[data-z]");
          if (!knopf) return;
          e.preventDefault();
          knopf.classList.add("gedrueckt");
          setTimeout(function () { knopf.classList.remove("gedrueckt"); }, 120);
          taste(knopf.dataset.z);
        });
        window.addEventListener("keydown", function (e) {
          if (!document.getElementById("pin").classList.contains("an")) return;
          if (e.key >= "0" && e.key <= "9") taste(e.key);
          else if (e.key === "Backspace") taste("x");
        });
        zeig("pin", true);
      });
    }

    // ---------- Querformat-Hinweis ----------
    var spielLaeuft = false;
    function pruefeLage() {
      var hoch = window.innerHeight > window.innerWidth;
      zeig("dreh", mobil && hoch && spielLaeuft);
    }
    window.addEventListener("resize", pruefeLage);
    window.addEventListener("orientationchange", pruefeLage);

    // Kein Zoomen und kein Kontextmenü auf dem Spielbild.
    document.addEventListener("gesturestart", function (e) { e.preventDefault(); });
    canvas.addEventListener("contextmenu", function (e) { e.preventDefault(); });

    // ---------- Startbild und Intro-Video ----------
    // Erst einmal tippen (sonst erlaubt der Browser keinen Ton), dann läuft das Intro.
    // Währenddessen lädt das Spiel schon im Hintergrund. Tippen oder eine Taste überspringt das Video.
    function startBild() {
      zeig("start", true);
      var los = false;
      function beginne() {
        if (los) return;
        los = true;
        zeig("start", false);
        spieleFilm();
        starteSpiel();
      }
      document.getElementById("start").addEventListener("pointerup", beginne);
      window.addEventListener("keydown", function (e) {
        if (!los && document.getElementById("start").classList.contains("an") && (e.key === "Enter" || e.key === " ")) beginne();
      });
    }
    function spieleFilm() {
      var schicht = document.getElementById("film"), video = document.getElementById("intro");
      var vorbei = false, seit = Date.now();
      function ende() {
        if (vorbei) return;
        vorbei = true;
        try { video.pause(); video.removeAttribute("src"); video.load(); } catch (e) {}
        zeig("film", false);
        canvas.focus();
      }
      function ueberspringen() { if (Date.now() - seit > 700) ende(); }
      zeig("film", true);
      video.addEventListener("ended", ende);
      video.addEventListener("error", ende);
      schicht.addEventListener("pointerup", ueberspringen);
      window.addEventListener("keydown", function () { if (!vorbei) ueberspringen(); });
      video.src = "intro.mp4";
      var spiel = video.play();
      if (spiel && spiel.catch) spiel.catch(ende);
    }

    // ---------- Unity starten ----------
    function starteSpiel() {
      zeig("lade", true);
      var buildUrl = "Build";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/c2723005f838a1222587dc856d7338bb.data",
        frameworkUrl: buildUrl + "/2404a8a6603af8cc502bcd2927611cf3.framework.js",
        codeUrl: buildUrl + "/cabc23d0cb51eee23d661f1512ef7192.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Weisslochhaus",
        productName: "Weisslochhaus",
        productVersion: "0.6.2",
        showBanner: function (msg, type) {
          if (type === "error") zeigeFehler(msg);
          else console.warn(msg);
        }
      };
      // Sehr scharfe Bildschirme (iPhone: 3-fach) nicht voll ausreizen, das kostet nur Leistung.
      config.devicePixelRatio = Math.min(window.devicePixelRatio || 1, 2);

      var skript = document.createElement("script");
      skript.src = buildUrl + "/9f5fe85dba31cbe19b05fc0eea5f9eef.loader.js";
      skript.onerror = function () { zeigeFehler("Die Spieldateien konnten nicht geladen werden. Internet prüfen und neu laden."); };
      skript.onload = function () {
        createUnityInstance(canvas, config, function (fortschritt) {
          var p = Math.round(fortschritt * 100);
          document.getElementById("balken-voll").style.width = p + "%";
          document.getElementById("prozent").textContent = p + " %";
          if (fortschritt >= 0.9) document.getElementById("lade-text").textContent = "Startet …";
        }).then(function (instanz) {
          window.unityInstanz = instanz;
          zeig("lade", false);
          spielLaeuft = true;
          pruefeLage();
        }).catch(function (meldung) {
          zeigeFehler("Start fehlgeschlagen: " + meldung);
        });
      };
      document.body.appendChild(skript);
    }

    pruefeUpdate().then(function (laedtNeu) {
      if (laedtNeu) return;
      if (istFrei()) startBild();
      else pinAbfrage().then(startBild);
    });
  </script>
</body>
</html>
